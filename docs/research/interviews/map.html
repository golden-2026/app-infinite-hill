<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Inter:wght@400;600&display=swap"><style>
@page{size:17in 11in;margin:0.6in}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,Arial,sans-serif;color:#111;height:9.8in;display:flex;flex-direction:column}
h1{font:800 26pt Manrope,Arial;margin:0}
.sub{font-size:14pt;color:#444;margin:6px 0 0}
svg{display:block;margin-top:8px;flex:1;width:100%;min-height:0}
.foot{display:flex;justify-content:space-between;font-size:11pt;color:#777;margin-top:10px}
</style></head><body>
<h1>My life with religion</h1>
<p class="sub">Draw one line from your birth to today. Go up when you felt close to faith. Go down when you felt far from it.</p>
<svg preserveAspectRatio="none" viewBox="0 0 1536 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <!-- y axis -->
  <line x1="150" y1="30" x2="150" y2="770" stroke="#111" stroke-width="3"/>
  <polygon points="150,14 140,36 160,36" fill="#111"/>
  <polygon points="150,786 140,764 160,764" fill="#111"/>
  <!-- x axis (middle) -->
  <line x1="150" y1="400" x2="1490" y2="400" stroke="#111" stroke-width="3"/>
  <polygon points="1512,400 1488,389 1488,411" fill="#111"/>
  <!-- y labels -->
  <text x="130" y="60" text-anchor="end" font-size="22" font-weight="600">Close</text>
  <text x="130" y="88" text-anchor="end" font-size="16" fill="#666">connected</text>
  <text x="130" y="742" text-anchor="end" font-size="22" font-weight="600">Far</text>
  <text x="130" y="770" text-anchor="end" font-size="16" fill="#666">disconnected</text>
  <!-- x labels -->
  <text x="162" y="436" text-anchor="start" font-size="20" font-weight="600">Birth</text>
  <text x="1500" y="438" text-anchor="end" font-size="20" font-weight="600">Today</text>
</svg>
<div class="foot"><span>Mark a ★ at the moments that mattered most.</span><span>Name: ____________________ &nbsp;&nbsp; Date: ______________</span></div>
</body></html>
