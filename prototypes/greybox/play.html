<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0A0A0A">
<title>Story Lesson</title>
<meta name="description" content="One player for every story lesson: the sacred-art film and narration, with a quick tap every shot or two, instant feedback, combos, light, and the streak at the end. Reads lessons/ID.json.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Story lesson player (2026-10-31), from "the son who came home, played". The film (moving paintings + narrator) stays the heart.
     Duolingo tactics around it: something to tap every shot or two, instant feedback with sound and a cheer,
     a combo for answers in a row, light earned, a lesson-complete count-up, then the streak and a friend invite.
     Never punishing: no hearts, a miss just shows the answer. One deliberate dark look. */
  :root {
    --night: #0A0A0A; --panel: #141414; --panel2: #1c1c1c;
    --text: #fbf6ee; --muted: #b9bfd3; --line: rgba(255,255,255,.18);
    --lemon: #eeff6a; --lamp: #EEFF6A; --ink: #15140a;
    --right: #eeff6a; --miss: #ff9a8a;
    --serif: "EB Garamond", Garamond, Georgia, serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--night); color: var(--text);
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  #app { position: relative; height: 100%; max-width: 520px; margin: 0 auto; overflow: hidden; background: var(--night); }

  /* the film */
  .clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.1s ease, filter .8s ease; }
  .clip.on { opacity: 1; }
  .clip.blur { filter: blur(14px) brightness(.55); }
  .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(4,6,14,.55), transparent 18%, transparent 46%, rgba(4,6,14,.88) 78%, rgba(4,6,14,.97)); }
  .tap { position: absolute; inset: 0; cursor: pointer; }

  /* top bar */
  .hud { position: absolute; left: 0; right: 0; top: 0; z-index: 5; padding: calc(env(safe-area-inset-top,0px) + 12px) 14px 0;
    display: flex; align-items: center; gap: 10px; }
  .x { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px; cursor: pointer; }
  .prog { flex: 1; height: 12px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--lemon);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); transition: width .5s cubic-bezier(.3,1.4,.5,1); }
  .light { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 15px; color: var(--lamp); font-variant-numeric: tabular-nums; }
  .light .flame { width: 12px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff3cf, #ffc561 45%, #e2801f 85%); box-shadow: 0 0 12px 3px rgba(255,176,70,.4); }
  .light.pop { animation: pop .5s ease; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .snd { border: 0; background: rgba(255,255,255,.12); color: var(--text); border-radius: 99px; font: 800 12px Manrope, sans-serif; padding: 6px 10px; cursor: pointer; }
  .combo { position: absolute; top: calc(env(safe-area-inset-top,0px) + 40px); left: 50%; transform: translate(-50%, -8px); z-index: 5;
    background: var(--lemon); color: var(--ink); font-weight: 900; font-size: 14px; border-radius: 99px; padding: 6px 14px;
    opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; }
  .combo.on { opacity: 1; transform: translate(-50%, 0); }
  .combo.hot { background: linear-gradient(90deg, #ff9f43, #ffd166, #ff9f43); font-size: 16px; padding: 8px 18px; box-shadow: 0 0 30px rgba(255,170,60,.7); }
  /* the guide asks the question and reacts to the answer (text only; the narrator stays the voice) */
  .asker { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  .asker img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--lemon); flex: none; }
  .asker span { font-size: 13px; font-weight: 800; color: var(--lemon); }
  .fb .react { display: flex; gap: 8px; align-items: center; margin: 2px 0 6px; font-size: 14px; font-weight: 700; }
  .fb .react img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; }
  .review-tag { display: inline-flex; gap: 6px; align-items: center; background: rgba(238,255,106,.14); color: var(--lemon); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; margin-bottom: 8px; }
  /* 10 in a row: the whole screen celebrates */
  .mega { position: absolute; inset: 0; z-index: 8; display: grid; align-content: center; justify-items: center; gap: 6px; pointer-events: none;
    background: radial-gradient(90% 60% at 50% 38%, #5a3a10, #0b0e22 72%); opacity: 0; transition: opacity .3s; }
  .mega.on { opacity: 1; }
  .mega b { font: 900 120px/.9 Manrope, sans-serif; color: #ffd166; text-shadow: 0 0 50px rgba(255,190,80,.8); transform: scale(.4); transition: transform .55s cubic-bezier(.2,1.7,.4,1); }
  .mega.on b { transform: none; }
  .mega span { font: 900 24px/1.1 Manrope, sans-serif; color: #fff; }
  .mega small { font-size: 14px; color: #f3e9d2; }
  .mega img { width: 170px; height: 170px; object-fit: contain; margin-top: 8px; }
  .perfect { display: inline-block; background: linear-gradient(90deg,#ffd166,#fff3c4,#ffd166); color: #2a1d00; font-weight: 900; font-size: 13px; padding: 5px 12px; border-radius: 99px; }
  /* the mascot dances: a quick move on a right answer, a bigger one at 3 in a row (2026-11-02) */
  .dancer { position: absolute; z-index: 3; right: 14px; top: calc(env(safe-area-inset-top,0px) + 58px); width: 112px; height: 112px; border-radius: 50%;
    overflow: hidden; background: #0e1630; border: 3px solid var(--lemon); box-shadow: 0 10px 30px rgba(0,0,0,.5);
    opacity: 0; transform: scale(.4) rotate(-12deg); transition: opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
  .dancer img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 6px; box-sizing: border-box; }
  .finnpop { animation: finnpop .8s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes finnpop { 0% { transform: scale(.3) rotate(-14deg); opacity: 0; } 55% { transform: scale(1.12) rotate(6deg); opacity: 1; } 75% { transform: scale(.96) rotate(-3deg); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .finnpop { animation: none; } }
  .dancer.on { opacity: 1; transform: none; }
  .dancer.big { right: 50%; margin-right: -75px; top: calc(env(safe-area-inset-top,0px) + 56px); width: 150px; height: 150px; border-radius: 36px; }
  .mascot.dance { width: 190px; height: 190px; object-fit: contain; }

  /* words over the film */
  .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 0 24px calc(env(safe-area-inset-bottom,0px) + 34px);
    display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; pointer-events: none; }
  .label { font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--lamp); }
  .line { font-family: var(--serif); font-weight: 500; font-size: clamp(21px, 5.6vw, 25px); line-height: 1.38; margin: 0; max-width: 30ch;
    text-wrap: balance; color: #fbf3e4; text-shadow: 0 1px 14px rgba(0,0,0,.9); opacity: 0; transform: translateY(6px); transition: opacity .9s, transform .9s; }
  .line.on { opacity: 1; transform: none; }
  .hint { font-size: 12px; color: rgba(251,243,228,.55); opacity: 0; transition: opacity .8s; }
  .hint.on { opacity: 1; }

  /* the card: questions, guide, ends */
  .card { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; max-height: 74%; overflow-y: auto; box-sizing: border-box;
    background: var(--panel); border-radius: 26px 26px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    display: flex; flex-direction: column; gap: 14px; transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.9,.3,1); }
  .card.on { transform: none; }
  .card.full { top: 0; max-height: none; border-radius: 0; padding-top: calc(env(safe-area-inset-top,0px) + 64px); background: var(--night); justify-content: center; }
  .eb { font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: var(--lamp); }
  .q { font-size: 22px; line-height: 1.25; font-weight: 900; margin: 0; text-wrap: balance; }
  .q .blank { display: inline-block; min-width: 92px; border-bottom: 3px solid var(--lemon); text-align: center; color: var(--lemon); }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--panel2); color: var(--text); border-radius: 16px;
    padding: 14px 16px; font-weight: 800; font-size: 16px; line-height: 1.3; text-align: left; cursor: pointer; transition: transform .1s, border-color .2s, background .2s; }
  .opt:active { transform: translateY(2px); border-bottom-width: 2px; }
  .opt.pick { border-color: var(--lemon); }
  .opt.right { border-color: var(--right); background: rgba(238,255,106,.14); color: var(--lemon); }
  .opt.miss { border-color: var(--miss); background: rgba(255,154,138,.12); animation: shake .35s; }
  .opt[disabled] { cursor: default; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .bank { display: flex; flex-wrap: wrap; gap: 10px; }
  .bank .opt { padding: 12px 18px; }
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match .opt { text-align: center; padding: 14px 8px; font-size: 15px; }
  .match .opt.done { opacity: .35; border-color: var(--right); }

  .btn { border: 0; border-radius: 16px; padding: 15px; font-weight: 900; font-size: 16px; letter-spacing: .02em; cursor: pointer;
    background: var(--lemon); color: var(--ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); width: 100%; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: none; border: 2px solid var(--line); }
  .btn[disabled] { opacity: .35; }

  /* feedback banner */
  .fb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; box-sizing: border-box;
    padding: 18px 18px calc(env(safe-area-inset-bottom,0px) + 18px); border-radius: 22px 22px 0 0;
    display: flex; flex-direction: column; gap: 10px; transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.9,.3,1); }
  .fb.on { transform: none; }
  .fb.good { background: #262d12; }
  .fb.soft { background: #33201f; }
  .fb .head { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; }
  .fb.good .head { color: var(--lemon); }
  .fb.soft .head { color: var(--miss); }
  .fb .head i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; flex: none; }
  .fb.good .head i { background: var(--lemon); color: var(--ink); }
  .fb.soft .head i { background: var(--miss); color: var(--ink); }
  .fb p { margin: 0; font-size: 15.5px; line-height: 1.5; color: rgba(255,255,255,.9); }
  .fb.soft .btn { background: var(--miss); }

  /* the guide */
  .say { display: flex; gap: 10px; align-items: flex-end; }
  .av { flex: none; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2.5px solid var(--lamp); box-sizing: border-box; background: #222; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .say p { margin: 0; background: #fff; color: #15181c; border-radius: 18px 18px 18px 4px; padding: 11px 14px; font-size: 16px; line-height: 1.45; font-weight: 600; }
  .who { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--lamp); margin: 0 0 -6px 56px; }
  .u { align-self: flex-end; max-width: 82%; background: var(--lemon); color: var(--ink); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-weight: 800; font-size: 15.5px; }

  /* title */
  .title { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 24px; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  .title.on { opacity: 1; }
  .title h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 9vw, 44px); margin: 0; color: #fbf3e4; }
  .title p { font-family: var(--serif); font-style: italic; font-size: 18px; margin: 0; color: rgba(251,243,228,.7); }
  .lampb { width: 14px; height: 26px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff3cf, #ffc561 45%, #e2801f 80%); box-shadow: 0 0 40px 14px rgba(255,176,70,.35); }

  /* ends */
  .big { font-size: 30px; line-height: 1.15; font-weight: 900; margin: 0; text-align: center; text-wrap: balance; }
  .mid { text-align: center; color: var(--muted); margin: 0; font-size: 16px; line-height: 1.5; }
  .mascot { width: 150px; height: 150px; border-radius: 34px; object-fit: cover; align-self: center; background: #fffbf3; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { border: 2px solid var(--lamp); border-radius: 16px; overflow: hidden; text-align: center; }
  .stat b { display: block; background: var(--lamp); color: var(--ink); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 4px; }
  .stat span { display: block; padding: 12px 4px; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .streakn { font-size: 96px; line-height: 1; font-weight: 900; text-align: center; color: var(--lamp); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(255,176,70,.45); }
  .bigflame { width: 70px; height: 104px; align-self: center; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 72%, #fff6d8, #ffc561 42%, #e2801f 82%); box-shadow: 0 0 60px 20px rgba(255,176,70,.35);
    animation: burn 2.4s ease-in-out infinite; }
  @keyframes burn { 0%,100% { transform: scale(1); } 40% { transform: scale(1.05,.95); } 70% { transform: scale(.97,1.05); } }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
  .week i { display: grid; place-items: center; margin: 6px auto 0; width: 32px; height: 32px; border-radius: 50%; font-style: normal; font-size: 15px;
    background: rgba(255,255,255,.1); color: var(--muted); }
  .week i.lit { background: var(--lamp); color: var(--ink); }
  .week i.rest { background: rgba(185,191,211,.25); color: var(--text); }
  .week i.today { box-shadow: 0 0 0 3px var(--lemon); }
  .friend { display: flex; gap: 12px; align-items: center; background: var(--panel2); border-radius: 18px; padding: 14px; }
  .friend .face { width: 48px; height: 48px; border-radius: 50%; background: #3a4570; display: grid; place-items: center; font-weight: 900; font-size: 18px; flex: none; }
  .friend div { flex: 1; min-width: 0; }
  .friend b { display: block; font-size: 16px; }
  .friend span { font-size: 14px; color: var(--muted); }
  .friend button { flex: none; width: auto; padding: 11px 16px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top,0px) + 70px); transform: translateX(-50%); z-index: 9; background: #fff; color: #15181c;
    font-weight: 800; font-size: 14px; border-radius: 99px; padding: 9px 16px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; }
  #sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
  @media (prefers-reduced-motion: reduce) { .bigflame { animation: none; } .opt.miss { animation: none; } }

  /* ═══ the new brand (2026-11-06): same look as hill-app, the site and the episodes. restyle only ═══ */
  :root { --night: #0A0A0A; --panel: #141414; --panel2: #1d1d1d; --text: #F3EFE4; --muted: rgba(243,239,228,.66); --line: rgba(243,239,228,.18);
    --lemon: #EEFF6A; --lamp: #EEFF6A; --ink: #0A0A0A; --right: #EEFF6A; --miss: #FF2D8A; --serif: Manrope, system-ui, sans-serif; }
  body { background: #000; font-family: Manrope, system-ui, sans-serif; }
  .title h1, .q, .big, .streakn, .mega b, .mega span, .fb .head, .stat span, .friend b { font-family: Anton, Impact, sans-serif !important; font-weight: 400 !important; text-transform: uppercase; letter-spacing: .01em; }
  .title h1 { font-size: clamp(48px, 13vw, 64px); line-height: .9; color: var(--text); text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  .title p { font-family: Manrope, sans-serif; font-style: normal; font-weight: 700; color: var(--muted); }
  .line { font-weight: 700; font-size: clamp(19px, 5.2vw, 23px); line-height: 1.35; color: var(--text); }
  .q { font-size: 32px; line-height: .98; }
  .big { font-size: 46px; line-height: .92; }
  .streakn { font-size: 130px; line-height: .85; color: var(--lemon); text-shadow: 0 0 50px rgba(238,255,106,.35); }
  .mega { background: radial-gradient(90% 60% at 50% 38%, #2a3008, #0A0A0A 72%); }
  .mega b { font-size: 150px; line-height: .85; color: var(--lemon); text-shadow: 0 0 50px rgba(238,255,106,.45); }
  .mega span { font-size: 34px; }
  .mega img, .mascot.dance { background: none; }
  .fb .head { font-size: 28px; }
  .fb.good { background: #1b1f08; }
  .fb.soft { background: #240b16; }
  .fb.soft .btn { background: var(--miss); color: #fff; }
  .combo { font-weight: 800; }
  .combo.hot { background: var(--gold, #EEFF6A); color: #0A0A0A; box-shadow: 0 0 30px rgba(238,255,106,.5); }
  .perfect { background: var(--lemon); color: var(--ink); }
  .btn { border-radius: 999px; font-weight: 800; box-shadow: none; padding: 16px; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { border: 0; box-shadow: inset 0 0 0 2px rgba(243,239,228,.85); }
  .opt { background: transparent; border: 0; box-shadow: inset 0 0 0 1.5px rgba(243,239,228,.28); border-radius: 999px; padding: 14px 20px; }
  .opt:active { transform: scale(.98); }
  .opt.pick { box-shadow: inset 0 0 0 2px var(--lemon); }
  .opt.right { box-shadow: inset 0 0 0 2px var(--lemon); background: rgba(238,255,106,.14); }
  .opt.miss { box-shadow: inset 0 0 0 2px var(--miss); background: rgba(255,45,138,.12); }
  .match .opt { border-radius: 18px; }
  .match .opt.done { box-shadow: inset 0 0 0 2px var(--right); }
  .card { background: var(--panel); }
  .say p { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .av { border-color: var(--lemon); }
  .stat { border-color: var(--lemon); border-radius: 18px; }
  .stat b { background: var(--lemon); }
  .stat span { font-size: 30px; }
  .week i.lit { background: var(--lemon); }
  .week i.rest { background: rgba(155,92,255,.3); }
  .friend { background: var(--panel2); border-radius: 22px; }
  .friend .face { background: #2a2a2a; }
  .toast { background: var(--lemon); color: var(--ink); }
  .snd { font-family: Manrope, sans-serif; background: rgba(243,239,228,.12); box-shadow: inset 0 0 0 1.5px rgba(243,239,228,.35); }
  .clip { filter: contrast(1.1) saturate(1.08) sepia(.14); }
  .clip.blur { filter: blur(14px) brightness(.55) contrast(1.1) sepia(.14); }
  .shade { background: linear-gradient(rgba(0,0,0,.55), transparent 18%, transparent 46%, rgba(0,0,0,.88) 78%, rgba(0,0,0,.97)); }
  .shade::after { content: ""; position: absolute; inset: -50%; background: var(--ih-grain); opacity: .3; mix-blend-mode: overlay; animation: ihGrain .6s steps(4) infinite; }

</style>

      $("#dancer").classList.remove("on");
      showCard('<img class="mascot dance finnpop" src="art/finn/finn-celebrate-still.webp" alt="" aria-hidden="true">' +
        '<p class="big">Story cleared!</p>' + (tries && right === tries ? '<p style="text-align:center;margin:0"><span class="perfect">perfect story · not one miss · +30 light</span></p>' : "") + '<p class="mid">The story, the real words, and what it means for your day. All yours now.</p>' +
        '<div class="stats"><div class="stat"><b>light</b><span id="sL">0</span></div><div class="stat"><b>right</b><span id="sA">0%</span></div><div class="stat"><b>best run</b><span>' + best + '</span></div></div>' +
        '<button class="btn" id="go">Continue</button>', true);
      var a = $("#app").getBoundingClientRect(); burst(a.width / 2, a.height * 0.3, 60);
      countUp($("#sL"), light, ""); countUp($("#sA"), acc, "%");
      on("go", function () { sfx.tap(); if (APP) { parent.postMessage({ ih: "done", score: right, of: SCORED }, "*"); return; } next(); });
    },
    streak: function () {
      sfx.win();
      // example week: five lit days, a rest day (moon), today lights the seventh
      var days = ["M", "T", "W", "T", "F", "S", "S"], st = ["lit", "lit", "rest", "lit", "lit", "lit", "today"];
      showCard('<div class="bigflame" aria-hidden="true"></div><div class="streakn" id="sn">6</div>' +
        '<p class="big" id="sh">day streak</p><p class="mid" id="sm">lantern lit. keep it glowing.</p>' +
        '<div class="week">' + days.map(function (d, k) { return "<div>" + d + '<i class="' + st[k] + '" id="d' + k + '">' + (st[k] === "rest" ? "☾" : st[k] === "lit" ? "✓" : "") + "</i></div>"; }).join("") + "</div>" +
        '<p class="mid" style="font-size:14px">☾ a rest day kept your streak safe. you have 2 left.</p>' +
        '<button class="btn" id="go">Continue</button>', true);
      later(function () {
        $("#sn").textContent = "7"; var d = $("#d6"); d.className = "lit today"; d.textContent = "✓";
        $("#sh").textContent = "7 days. a full week!"; $("#sm").textContent = "a whole week, lit. look at you. i’m so proud of you.";
        var a = $("#app").getBoundingClientRect(); burst(a.width / 2, a.height * 0.25, 70); sfx.combo(); buzz([40, 60, 40]);
      }, 1100);
      on("go", function () { sfx.tap(); next(); });
    },
    friend: function () {
      showCard('<div class="eb">tomorrow</div><p class="big" style="text-align:left">' + esc(L.tomorrow.title) + '</p>' +
        '<p class="mid" style="text-align:left">' + esc(L.tomorrow.line) + '</p>' +
        '<div class="col"><div class="friend"><div class="face">M</div><div><b>Walk it with Mom</b><span>you both play this story, then swap one line.</span></div><button class="btn" id="inv">Invite</button></div></div>' +
        '<button class="btn ghost" id="again">Play again</button>', true);
      on("inv", function () { sfx.right(); this.textContent = "Sent ✓"; this.disabled = true; toast("Invite ready for Mom"); });
      on("again", restart);
    },
  };
  function countUp(el, to, suf) {
    var t0 = performance.now(), d = still ? 1 : 900;
    (function f(t) { var k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suf; if (k < 1) requestAnimationFrame(f); })(t0);
  }

  function restart() {
    clearLater(); voice.pause(); voice.onended = null; fb.classList.remove("on"); $("#title").classList.remove("on");
    i = -1; light = 0; combo = 0; best = 0; right = 0; tries = 0; $("#lightN").textContent = "0"; curClip = null;
    next();
  }
  on("x", function () { if (APP) { clearLater(); voice.pause(); vids.forEach(function (v) { v.pause(); }); parent.postMessage({ ih: "close" }, "*"); return; } restart(); });
  on("snd", function () { soundOn = !soundOn; this.textContent = soundOn ? "sound on" : "sound off"; if (!soundOn) voice.pause(); });
  $("#tap").onkeydown = function (e) { if ((e.key === "Enter" || e.key === " ") && this.onclick) { e.preventDefault(); this.onclick(); } };

  fetch("lessons/" + ID + ".json").then(function (r) { return r.json(); }).then(function (j) {
    L = j; CLIPS = L.clips; VOICE = L.voice || ""; GUIDE = L.guide.photo; TOLD = L.told;
    var RV = dueReview();
    STEPS = [{ t: "hook" }, { t: "title" }].concat(RV ? [{ t: "review", r: RV }] : [], L.steps, [{ t: "today" }, { t: "done" }], APP ? [] : [{ t: "streak" }, { t: "friend" }]);
    SCORED = STEPS.filter(function (s) { return (s.t === "ask" && !s.predict) || s.t === "fill" || s.t === "match" || s.t === "review"; }).length;
    combo = loadRun(); best = combo;
    document.title = L.title; $("#tTitle").textContent = L.title; $("#tTold").textContent = L.told;
    $("#x").setAttribute("aria-label", APP ? "Close" : "Start over");
    next();
  }).catch(function () { $("#tTitle").textContent = "This story is almost here"; $("#title").classList.add("on"); });
})();
</script>
