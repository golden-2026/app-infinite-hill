<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:,">
<title>Infinite Hill Episode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Infinite Hill curriculum player: one page for all 14,328 lessons.
   Type-led episodes (no film): kinetic type, colour fields, grain, particles, live-made music.
   ?door=<door>&day=<n> loads data/<door>/<n>.json, made by convert.mjs. Lime + black is the ownable look. */
:root {
  --ink: #0A0A0A; --night: #070a14; --paper: #F3EFE4; --y: #EEFF6A;
  --p: #FF2D8A; --o: #FF8A1F; --g: #19E68C; --b: #2F7BFF; --v: #9B5CFF;
  --c0: #FF2D8A; --c1: #19E68C; --c2: #2F7BFF; --c3: #FF8A1F; --c4: #9B5CFF;
  --muted: rgba(243,239,228,.7);
  --display: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
#reel { position: relative; width: min(100vw, calc(100dvh * .5625)); height: 100dvh; overflow: hidden; overflow: clip; background: var(--ink); isolation: isolate; user-select: none; -webkit-user-select: none; }
@media (max-aspect-ratio: 10/16) { #reel { width: 100vw; } }
#field { position: absolute; inset: 0; background: var(--ink); transition: background .25s; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
#grain { position: absolute; inset: -40px; pointer-events: none; z-index: 6; opacity: .16; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain .5s steps(4) infinite; }
@keyframes grain { 25% { transform: translate(-12px, 8px); } 50% { transform: translate(10px, -14px); } 75% { transform: translate(-6px, -10px); } }
#flash { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; background: var(--y); }
#wipe { position: absolute; inset: 0; z-index: 7; pointer-events: none; }

/* top bar */
#top { position: absolute; z-index: 8; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 14px 0; display: grid; gap: 8px; pointer-events: none; }
#bars { display: flex; gap: 4px; }
#bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(243,239,228,.22); overflow: hidden; position: relative; }
#bars i b { position: absolute; inset: 0; background: var(--y); transform-origin: left; transform: scaleX(0); transition: transform .3s; }
#row { display: flex; align-items: center; gap: 8px; }
#chip { box-shadow: 0 0 0 2px var(--ink); font: 800 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); background: var(--y); padding: 6px 8px; border-radius: 4px; }
#seg { font: 800 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
#snd, #x { pointer-events: auto; margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(10,10,10,.6); color: var(--paper); display: grid; place-items: center; cursor: pointer; }
#x { margin-left: 0; text-decoration: none; }
#snd svg, #x svg { width: 18px; height: 18px; }

/* scenes */
#stage { position: absolute; inset: 0; z-index: 4; overflow: hidden; overflow: clip; }
.scene { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; padding: 86px 18px max(24px, env(safe-area-inset-bottom)); }
.scene.in { animation: sIn .35s cubic-bezier(.2,1.2,.3,1) both; }
@keyframes sIn { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
.tr-punch.in { animation: punch .32s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes punch { from { transform: scale(1.35); opacity: 0; } to { transform: none; opacity: 1; } }
.tr-whip.in { animation: whip .3s cubic-bezier(.3,1.3,.4,1) both; }
@keyframes whip { from { transform: translateX(110%) skewX(-18deg); } to { transform: none; } }
.tr-glitch.in { animation: glitch .36s steps(6) both; }
@keyframes glitch { 0% { clip-path: inset(0 0 80% 0); transform: translateX(-12px); } 33% { clip-path: inset(40% 0 20% 0); transform: translateX(10px); } 66% { clip-path: inset(10% 0 50% 0); transform: translateX(-6px); } 100% { clip-path: inset(0); transform: none; } }
.tr-iris.in { animation: iris .4s ease-out both; }
@keyframes iris { from { clip-path: circle(0% at 50% 50%); } to { clip-path: circle(120% at 50% 50%); } }
.tr-blinds.in { animation: blinds .38s steps(5) both; }
@keyframes blinds { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
.tr-wipe.in { animation: wipeIn .34s cubic-bezier(.6,0,.2,1) both; }
@keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }

.kick { font: 800 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--y); margin: 0 0 18px; }
.H { font-family: var(--display); text-transform: uppercase; line-height: .9; letter-spacing: .005em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.H .w { display: inline-block; margin-right: .16em; animation: slam .24s cubic-bezier(.2,1.6,.4,1) both; }
.H .y { color: var(--y); }
@keyframes slam { from { transform: translateY(18px) scale(1.5); opacity: 0; filter: blur(5px); } to { transform: none; opacity: 1; filter: none; } }
.body { font: 600 18px/1.42 var(--body); color: var(--paper); margin: 0; max-width: 34ch; }
.body.small { font-size: 15px; color: var(--muted); }
.slab { background: var(--ink); padding: 14px 16px; border-radius: 4px; align-self: flex-start; }
.btn { font: 800 16px/1 var(--body); letter-spacing: .04em; text-transform: lowercase; border: 0; border-radius: 999px; padding: 17px 24px; cursor: pointer; background: var(--y); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(243,239,228,.55); }
.btn:active { transform: scale(.97); }
/* hints: small and quiet (2026-11-08): Manrope, low-opacity cream, no animation */
.hint { margin-top: auto; font: 600 12px/1.2 var(--body); letter-spacing: .02em; color: rgba(243,239,228,.5); padding-top: 14px; }
@keyframes blink { 50% { opacity: .35; } }
.spacer { flex: 1; }

/* drop tags: one retro treatment per drop */
.dropwrap { margin: 0 0 16px; align-self: flex-start; max-width: 100%; }
.dropwrap small { display: block; font: 800 11px/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.drop { font-family: var(--display); text-transform: uppercase; font-size: 30px; line-height: .95; display: inline-block; max-width: 100%; }
.end .dropwrap { background: var(--ink); padding: 12px 14px 14px; border-radius: 6px; }
.t-chrome { color: #fff; font-style: italic; transform: skewX(-8deg); text-shadow: 0 1px 0 #cfd6e6, 0 2px 0 #9aa6bf, 0 3px 0 #6b7894, 0 4px 0 #3c4660, 0 8px 14px rgba(0,0,0,.6); }
.t-varsity { color: var(--y); -webkit-text-stroke: 1.5px var(--ink); text-shadow: 3px 3px 0 var(--ink), 5px 5px 0 var(--y); letter-spacing: .04em; }
.t-bubble { color: var(--ink); background: var(--y); padding: 6px 14px 4px; border-radius: 999px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--y); }
.t-stencil { color: var(--y); letter-spacing: .12em; -webkit-mask: repeating-linear-gradient(90deg, #000 0 9px, transparent 9px 11px); mask: repeating-linear-gradient(90deg, #000 0 9px, transparent 9px 11px); }
.t-vhs { color: #fff; text-shadow: -3px 0 #ff2d55, 3px 0 #19e6d4; background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, transparent 2px 4px); padding: 4px 8px; }
.t-racing { color: var(--ink); background: var(--y); padding: 6px 12px; font-style: italic; transform: skewX(-14deg); box-shadow: 8px 0 0 var(--ink), 12px 0 0 var(--y), 18px 0 0 var(--ink), 22px 0 0 var(--y); }
.t-extrude { color: var(--y); text-shadow: 1px 1px 0 #9aa63e, 2px 2px 0 #7d8732, 3px 3px 0 #616927, 4px 4px 0 #454b1c, 5px 5px 0 #000, 7px 7px 10px rgba(0,0,0,.7); }
.t-sticker { color: var(--ink); background: #fff; padding: 6px 12px 4px; transform: rotate(-3deg); border-radius: 6px; box-shadow: 0 0 0 3px var(--y), 4px 6px 0 rgba(0,0,0,.5); }

/* kinetic opening layouts */
#kin { position: absolute; inset: 0; overflow: hidden; }
.kl { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 90px 18px 110px; }
.L-stack .ln { opacity: .28; transition: opacity .2s; font-size: 46px; } .L-stack .ln.on { opacity: 1; color: var(--y); }
.L-giant .ln { text-align: left; }
.L-split { padding: 0; }
.L-split .half { flex: 1; display: flex; align-items: center; padding: 20px 18px; }
.L-split .half.a { background: var(--c0); color: var(--ink); } .L-split .half.b { background: var(--ink); color: var(--y); }
.L-poster { background: var(--y); color: var(--ink); }
.L-poster .old { font: 800 13px/1.3 var(--body); letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin-bottom: 14px; }
.L-marquee { padding: 0; justify-content: space-around; }
/* marquee: each row is a clean repeating band (line ✦ line ✦ …), spaced by the measured width of one unit */
.mq { white-space: nowrap; font-family: var(--display); text-transform: uppercase; font-size: 84px; line-height: 1.05; will-change: transform; }
.mq .u { display: inline-block; }
.mq .sep { display: inline-block; color: var(--y); font-size: .55em; vertical-align: .32em; margin: 0 .45em; -webkit-text-stroke: 0; }
.mq.r { color: transparent; -webkit-text-stroke: 2px var(--y); }
.mq.y { color: var(--y); }
.L-tape .tape { position: absolute; left: -20%; right: -20%; height: 54px; background: repeating-linear-gradient(-45deg, var(--y) 0 24px, var(--ink) 24px 48px); display: flex; align-items: center; overflow: hidden; }
.L-tape .tape span { background: var(--ink); color: var(--y); font: 400 28px/1 var(--display); text-transform: uppercase; padding: 6px 14px; margin: 0 auto; white-space: nowrap; }
.L-tape .t1 { top: 18%; transform: rotate(-9deg); } .L-tape .t2 { bottom: 16%; transform: rotate(7deg); }
.L-outline .ln { color: transparent; -webkit-text-stroke: 2px rgba(243,239,228,.8); }
.L-outline .ln.fill { color: var(--y); -webkit-text-stroke: 0; }
.L-type .ln::after { content: "_"; color: var(--y); animation: blink .7s steps(1) infinite; }
.L-stamp .st { position: absolute; border: 6px solid var(--y); color: var(--y); padding: 10px 14px 6px; font: 400 44px/.95 var(--display); text-transform: uppercase; max-width: 86%; animation: stampIn .28s cubic-bezier(.2,1.8,.4,1) both; background: rgba(10,10,10,.75); }
.L-stamp .st.old { opacity: .35; }
@keyframes stampIn { from { transform: var(--rot) scale(2.2); opacity: 0; } to { transform: var(--rot) scale(1); opacity: 1; } }

/* cover */
.cover .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tag { font: 800 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; padding: 7px 9px; border-radius: 4px; background: rgba(243,239,228,.12); color: var(--paper); }
.tag.y { background: var(--y); color: var(--ink); }
.cover .bigday { white-space: nowrap; font: 400 96px/.86 var(--display); color: var(--y); margin: 0 0 8px; letter-spacing: -.01em; }
.cover .cta { display: grid; gap: 10px; margin-top: auto; }
.scene.cover { isolation: isolate; }
.cover .coldbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.cover .coldscrim { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10,10,10,.55), rgba(10,10,10,.15) 40%, rgba(10,10,10,.75)); }

/* games */
.q { font: 400 34px/.98 var(--display); text-transform: uppercase; margin: 0 0 18px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; font: 700 16px/1.3 var(--body); color: var(--paper); background: #1a1a1a; border: 2px solid rgba(243,239,228,.3); border-radius: 14px; padding: 15px 16px; cursor: pointer; }
.opt.no { border-color: #ff2d55; opacity: .45; animation: nope .3s; }
.opt.ok { background: var(--y); color: var(--ink); border-color: var(--y); }
@keyframes nope { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.say { margin-top: 14px; font: 700 16px/1.4 var(--body); color: var(--paper); min-height: 22px; }
.say b { color: var(--y); }
.bubble { background: rgba(243,239,228,.12); border-radius: 18px 18px 18px 4px; padding: 12px 14px; font: 600 16px/1.4 var(--body); margin-bottom: 16px; }
.bubble small { display: block; font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--y); margin-bottom: 6px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match .opt { font-size: 14px; padding: 12px; min-height: 64px; }
.match .opt.sel { border-color: var(--y); box-shadow: 0 0 0 2px var(--y); }
.match .opt.done { background: var(--y); color: var(--ink); border-color: var(--y); opacity: .9; pointer-events: none; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.tf .opt { text-align: center; font: 400 30px/1 var(--display); text-transform: uppercase; }
.myth-card { font: 400 30px/1 var(--display); text-transform: uppercase; background: var(--paper); color: var(--ink); padding: 18px; border-radius: 6px; transform: rotate(-1.5deg); }
.count { font: 800 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.next { margin-top: 16px; align-self: flex-start; }

/* finn */
#finn { position: absolute; z-index: 5; right: 6px; bottom: 6px; width: 118px; height: 118px; pointer-events: none; opacity: 0; transform: translateY(30px) scale(.8); transition: opacity .2s, transform .3s cubic-bezier(.2,1.6,.4,1); }
#finn.on { opacity: 1; transform: none; }
#finn img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)); }

/* end card */
.end { background: var(--y); color: var(--ink); }
.end .H { color: var(--ink); }
.end .streak { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
.end .streak span { background: var(--ink); color: var(--y); font: 800 13px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 9px 11px; border-radius: 4px; }
.end .cliff { background: var(--ink); color: var(--paper); padding: 16px; border-radius: 6px; margin-top: 8px; }
.end .cliff small { font: 800 11px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--y); }
.end .cliff div { font: 400 30px/.98 var(--display); text-transform: uppercase; margin-top: 8px; }
.end .btns { display: grid; gap: 10px; margin-top: auto; }
.end .btn { background: var(--ink); color: var(--y); }
.end .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.receipt { border-top: 2px dashed rgba(243,239,228,.3); padding: 10px 0; }
.receipt b { font: 800 14px/1.3 var(--body); display: block; }
.receipt q { display: block; font: 600 15px/1.4 var(--body); color: var(--muted); margin-top: 4px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
.ring { width: 150px; height: 150px; border-radius: 50%; border: 6px solid var(--y); margin: 20px auto; animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1.05); opacity: 1; } }
#err { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; z-index: 9; background: var(--ink); }
#toast { position: absolute; z-index: 9; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--paper); color: var(--ink); font: 800 14px/1 var(--body); padding: 12px 16px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.on { opacity: 1; }
/* remix: the lime pill next to the sound button (../assets/ih-remix.js draws it and its sheet) */
#reel > .rx-btn { top: calc(max(10px, env(safe-area-inset-top)) + 14px); right: 62px; }
#reel.rx-cover > .rx-btn { right: 16px; top: calc(max(10px, env(safe-area-inset-top)) + 22px); }
#reel.rx-hide > .rx-btn { opacity: 0; pointer-events: none; }
.tr-calm.in { animation: sIn .55s ease-out both; }
/* the story: real film, full-bleed 9:16 clips in sequence, kinetic captions on top (films.json, made by films.mjs) */
.scene.story { padding: 0; overflow: hidden; background: #000; }
.story .sv { position: absolute; inset: 0; overflow: hidden; }
.story .shot { position: absolute; inset: 0; overflow: hidden; background: #000; }
.story .shot video, .story .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.story .kb { animation: kbPush var(--d, 7s) linear both; transform-origin: 50% 50%; }
.story .kb.mv-pull { animation-name: kbPull; } .story .kb.mv-drift { animation-name: kbDrift; } .story .kb.mv-pan-right { animation-name: kbPanR; }
.story .kb.mv-pan-left { animation-name: kbPanL; } .story .kb.mv-tilt-up { animation-name: kbTiltU; } .story .kb.mv-tilt-down { animation-name: kbTiltD; }
@keyframes kbPush { from { transform: scale(1.02); } to { transform: scale(1.16); } }
@keyframes kbPull { from { transform: scale(1.16); } to { transform: scale(1.02); } }
@keyframes kbDrift { from { transform: scale(1.1) translate(-2.5%, 1%); } to { transform: scale(1.14) translate(2.5%, -1%); } }
@keyframes kbPanR { from { transform: scale(1.14) translateX(-4%); } to { transform: scale(1.14) translateX(4%); } }
@keyframes kbPanL { from { transform: scale(1.14) translateX(4%); } to { transform: scale(1.14) translateX(-4%); } }
@keyframes kbTiltU { from { transform: scale(1.14) translateY(4%); } to { transform: scale(1.14) translateY(-4%); } }
@keyframes kbTiltD { from { transform: scale(1.14) translateY(-4%); } to { transform: scale(1.14) translateY(4%); } }
.story .scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.62) 0, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 46%, rgba(0,0,0,.78) 100%); }
.story .sk { position: absolute; left: 18px; top: 86px; margin: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.story .sk .tag { background: rgba(10,10,10,.7); }
.story .cap { position: absolute; left: 16px; right: 16px; bottom: 58px; max-height: 40%; display: flex; flex-direction: column; justify-content: flex-end; }
.story .cap .H { font-size: 40px; line-height: .95; }
.story .hint { position: absolute; left: 22px; bottom: 22px; margin: 0; padding: 0; }
.story .ticks { position: absolute; right: 18px; bottom: 24px; display: flex; gap: 5px; }
.story .ticks i { width: 7px; height: 7px; border-radius: 50%; background: rgba(243,239,228,.35); }
.story .ticks i.on { background: var(--y); }
/* caption looks, one per opening layout family, so the films vary with the rest of the day */
.cap-shadow .H { color: var(--paper); text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.7); }
.cap-slab .H { background: var(--y); color: var(--ink); padding: 10px 12px 8px; border-radius: 4px; align-self: flex-start; box-shadow: 6px 6px 0 var(--ink); }
.cap-slab .H .w.y { color: var(--y); background: var(--ink); padding: 0 4px; }
.cap-stamp .H { border: 5px solid var(--y); color: var(--y); background: rgba(10,10,10,.72); padding: 10px 12px 6px; align-self: flex-start; transform: rotate(-2.5deg); animation: stampIn .28s cubic-bezier(.2,1.8,.4,1) both; --rot: rotate(-2.5deg); }
.cap-stamp .H .y { color: var(--paper); }
.cap-strip .H { line-height: 1.12; }
.cap-strip .H .w { background: var(--ink); color: var(--paper); padding: 2px 6px 0; margin: 0 2px 4px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.cap-strip .H .w.y { background: var(--y); color: var(--ink); }
/* cinema (the og caption style, 2026-11-08): huge Anton in the lower third, one lime keyword, optional small Manrope line */
.story .cap.cap-cinema { left: 22px; right: 18px; bottom: 58px; max-height: none; }
.cap-cinema .H { color: #f4f1ea; font-size: 62px; line-height: .9; letter-spacing: -.005em; overflow-wrap: normal; text-shadow: 0 2px 20px rgba(0,0,0,.45); animation: cineIn .4s cubic-bezier(.2,.9,.3,1) both; }
.cap-cinema .H .w { white-space: nowrap; margin-right: .2em; animation: none; }
.cap-cinema .H .w.y { color: var(--y); }
.cap-cinema .sub { font: 700 15px/1.35 var(--body); color: #f4f1ea; opacity: .9; margin: 12px 0 0; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
@keyframes cineIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
/* cinema grade: the photoreal look only. darker, premium, near-black foot, soft vignette. remix looks play ungraded */
.story.cine-grade .shot video, .story.cine-grade .shot img { filter: contrast(1.18) saturate(.92) brightness(.92); }

<script src="../assets/ih-remix.js"></script>

<script>

/* the film for this day, if any: films.json lists the clips; each is checked here (mp4, else webp, else skipped) */

function start(D, FILM) {

/* ---------- remix (presentation only: never the words) ---------- */

/* ---------- sound ---------- */

/* ---------- particles: removed 2026-11-08 (owner: "corny"). kept as no-ops so every tap and beat works unchanged ---------- */
var pulse = 0;

var curScene = -1, solved = true;

/* ---------- cover ---------- */
function dropTag() { return '<div class="dropwrap"><small>drop ' + String(D.drop.n).padStart(3, "0") + " · day " + D.drop.pos + " of " + D.drop.of + '</small><span class="drop t-' + esc(D.drop.tr) + '">' + esc(D.drop.name) + "</span></div>"; }
function cover(el) {
  el.className += " cover";
  el.innerHTML = '<div class="meta"><span class="tag y">' + esc(FAITH[D.door]) + '</span><span class="tag">year ' + D.year + '</span><span class="tag">' + esc(E.genreName === "fallback" ? ST.genre : E.genreName) + " · " + E.BPM + "</span></div>" + dropTag() +
    '<p class="bigday">day ' + D.day + '</p><h1 class="H pulse" style="font-size:60px">' + wordsHTML(D.title, hotIdx(D.title)) + "</h1>" +
    (D.last ? '<p class="body small" style="margin-top:12px">last time: ' + esc(D.last.toLowerCase()) + "</p>" : "") +
    '<div class="cta"><button class="btn" id="play">play it loud</button><button class="btn ghost" id="quiet">watch on silent</button></div>';

// cold open: the film's loudest clip plays full-bleed behind the cover from the first frame
function coldBg(el) {
  var s = FILM.shots[(FILM.loud || 1) - 1] || FILM.shots[0], v = document.createElement("video");
  v.className = "coldbg"; v.muted = true; v.defaultMuted = true; v.playsInline = true; v.loop = true; v.autoplay = true;
  function lk(u) { return FILM.looks && FILM.looks.default ? String(u).replace(/\/clips\/([^/]+)$/, "/looks/" + FILM.looks.default + "/$1") : u; }

    else if (lay === "poster") html = '<div class="kl L-poster"><p class="old">' + lines.slice(0, i).map(esc).join(" / ") + '</p><p class="H ln">' + wordsHTML(t) + "</p></div>";

    else if (lay === "tape") { var tp = (esc(D.word) + " • ").repeat(6); html = '<div class="kl L-tape"><div class="tape t1"><span>' + tp + '</span></div><p class="H ln">' + wordsHTML(t, hotIdx(t)) + '</p><div class="tape t2"><span>' + tp + "</span></div></div>"; }
    else if (lay === "outline") html = '<div class="kl L-outline">' + [0, 1, 2].map(function (k) { return '<p class="H ln' + (k === 1 ? " fill" : "") + '">' + esc(t) + "</p>"; }).join("") + "</div>";

    else [].forEach.call(kin.querySelectorAll(".ln"), function (p) { fit(p, lay === "outline" ? 72 : 78, 22, lay === "giant" ? H * .7 / Math.max(1, t.split(/\s+/).length) : lay === "outline" ? H * .22 : H * .55); });
    if (lay === "marquee") [].forEach.call(kin.querySelectorAll(".mq"), function (row, k) {
      var u = row.firstChild, uw = u.getBoundingClientRect().width || 300, n = Math.ceil((W + 40) / uw) + 2;
      row.innerHTML = new Array(n + 1).join(u.outerHTML);
      var a = 18, b = 18 - uw, dur = uw / 110 * 1000;          // ~110 px a second; every copy sits exactly one unit apart
      if (!RM) row.animate([{ transform: "translateX(" + (k === 1 ? b : a) + "px)" }, { transform: "translateX(" + (k === 1 ? a : b) + "px)" }], { duration: dur, iterations: Infinity });
      else row.style.transform = "translateX(18px)";
