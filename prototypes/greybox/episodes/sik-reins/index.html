<style>
/* Infinite Hill episode engine. Derived from SP/eps/template-full.html (episode A, "the night out").
   One full-bleed 9:16 reel: video, film grain, particle canvas, kinetic type, then the scene layer.
   Everything that varies per episode (genre, key, tempo, opening, transition, captions, end card, palette,
   stage lights, particles) comes from CFG.style, which build.mjs assigns. */
:root {
  --night: #0A0A0A; --ink: #0A0A0A; --paper: #F3EFE4;
  --y: #EEFF6A;      /* lime: the brand colour, CTAs and the one key word */
  --p: #FF2D8A; --o: #FF8A1F; --g: #19E68C; --b: #2F7BFF; --v: #9B5CFF;
  --c0: #FF2D8A; --c1: #19E68C; --c2: #2F7BFF; --c3: #FF8A1F; --c4: #9B5CFF;
  --muted: rgba(243, 239, 228, 0.68);
  --display: "Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); }
#reel { position: relative; width: min(100vw, calc(100dvh * 0.5625)); height: 100%; max-height: 100dvh; overflow: hidden;
  background: var(--night); touch-action: none; user-select: none; -webkit-user-select: none; isolation: isolate; }
@media (max-aspect-ratio: 10/16) { #reel { width: 100vw; } }
#shake { position: absolute; inset: 0; }
.vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease, transform 9s linear;
  transform: scale(var(--zoom, 1.02)); transform-origin: var(--ox, 50%) var(--oy, 50%); filter: var(--grade, none); }
.vid.on { opacity: 1; }
.vid.blur { filter: var(--grade, none) blur(14px) brightness(.7); }
#grade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(rgba(5,6,12,.55), transparent 18%, transparent 46%, rgba(5,6,12,.55) 70%, rgba(5,6,12,.88)); }
/* cinema grade (owner's standard, 2026-11-08): only on the photoreal look. darker, premium, near-black foot, soft vignette. no ring grain */
.cine-grade .vid { filter: contrast(1.18) saturate(.92) brightness(.92); }
.cine-grade .vid.blur { filter: contrast(1.18) saturate(.92) brightness(.92) blur(14px) brightness(.7); }
.cine-grade #grade { background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 22%, transparent 45%, rgba(0,0,0,.85) 100%),
  radial-gradient(120% 80% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%); }
.cine-grade #tint { display: none; }
#tint { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0;
  background: radial-gradient(120% 70% at 50% 110%, var(--c0), transparent 60%), radial-gradient(90% 50% at 0% 0%, var(--c3), transparent 60%); }
#grain { position: absolute; inset: -40px; pointer-events: none; opacity: .13; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain .5s steps(4) infinite; }
@keyframes grain { 25% { transform: translate(-12px, 8px); } 50% { transform: translate(10px, -14px); } 75% { transform: translate(-6px, -10px); } }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: var(--y); mix-blend-mode: screen; }
#wipe { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0; }

/* ---------- kinetic captions: four styles ---------- */
#cap { position: absolute; left: 0; right: 0; top: 56%; padding-inline: max(18px, env(safe-area-inset-left, 0px)) max(18px, env(safe-area-inset-right, 0px));
  pointer-events: none; text-align: left; }
.chunk { font-family: var(--display); text-transform: uppercase; font-size: 58px; line-height: .92; letter-spacing: .005em;
  color: var(--paper); text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 28px rgba(0,0,0,.55); text-wrap: balance; }
.chunk.long { font-size: 46px; }
.chunk span { display: inline-block; margin-right: .18em; animation: slam .22s cubic-bezier(.2,1.6,.4,1) both; }
.chunk .y { color: var(--y); } .chunk .p { color: var(--p); } .chunk .o { color: var(--o); } .chunk .g { color: var(--g); } .chunk .b { color: #6FA6FF; } .chunk .v { color: #B98CFF; }
.chunk.drop { font-size: 76px; color: var(--y); text-align: center; line-height: .9; }
.chunk.drop span { animation: dropslam .5s cubic-bezier(.2,1.4,.3,1) both; text-shadow: 0 0 40px var(--c0), 0 6px 0 var(--c0); }
@keyframes slam { from { transform: translateY(18px) scale(1.5); opacity: 0; filter: blur(6px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes dropslam { 0% { transform: scale(3); opacity: 0; } 60% { transform: scale(.94); opacity: 1; } 100% { transform: none; } }
/* boxed: tiktok-style word boxes, centred low */
.cap-boxed #cap { top: 60%; text-align: center; }
.cap-boxed .chunk { font-size: 44px; text-shadow: none; line-height: 1.12; }
.cap-boxed .chunk span { background: var(--ink); padding: .04em .16em 0; margin: 0 .06em .1em; border-radius: 6px; animation: pop .18s cubic-bezier(.2,1.8,.4,1) both; }
.cap-boxed .chunk span.y { background: var(--y); color: var(--ink); }
.cap-boxed .chunk.drop span { background: var(--y); color: var(--ink); text-shadow: none; font-size: 64px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
/* tilt: alternating tilted tape strips */
.cap-tilt #cap { top: 52%; }
.cap-tilt .chunk { display: inline-block; font-size: 54px; background: var(--ink); padding: 8px 14px 4px; box-shadow: 8px 8px 0 var(--c0); text-shadow: none;
  transform: rotate(var(--rot, -3deg)); animation: tape .28s cubic-bezier(.2,1.5,.4,1) both; }
.cap-tilt .chunk span { animation: none; }
.cap-tilt .chunk.drop { background: var(--y); color: var(--ink); box-shadow: 10px 10px 0 var(--ink); font-size: 72px; }
.cap-tilt .chunk.drop span { animation: none; text-shadow: none; }
@keyframes tape { from { transform: rotate(var(--rot, -3deg)) scale(1.7); opacity: 0; } to { transform: rotate(var(--rot, -3deg)); opacity: 1; } }
/* cinema (the og style, 2026-11-08): huge Anton in the lower third, one lime keyword, optional small Manrope line */
.cap-cinema #cap { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); padding-inline: max(22px, env(safe-area-inset-left, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
.cap-cinema .chunk, .cap-cinema .chunk.long, .cap-cinema .chunk.drop { font-size: 62px; line-height: .9; letter-spacing: -.005em; color: #f4f1ea; text-align: left;
  text-shadow: 0 2px 20px rgba(0,0,0,.45); text-wrap: balance; animation: cineIn .4s cubic-bezier(.2,.9,.3,1) both; }
.cap-cinema .chunk span, .cap-cinema .chunk.drop span { display: inline-block; white-space: nowrap; margin-right: .2em; color: #f4f1ea; animation: none; text-shadow: inherit; }
.cap-cinema .chunk span.k { color: var(--y); }
.cap-cinema .sub { font: 700 15px/1.35 var(--body); color: #f4f1ea; opacity: .9; margin-top: 12px; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
@keyframes cineIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
/* ticker: a running lower third that builds the sentence */
.cap-ticker #cap { top: auto; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.tick { border-left: 6px solid var(--y); padding: 6px 0 6px 14px; font: 800 27px/1.22 var(--body); color: var(--paper); text-shadow: 0 2px 14px rgba(0,0,0,.8); }
.tick span { animation: up .3s cubic-bezier(.2,1,.3,1) both; display: inline; }
.tick .y { color: var(--y); } .tick .p { color: var(--p); } .tick .o { color: var(--o); } .tick .g { color: var(--g); } .tick .b { color: #6FA6FF; } .tick .v { color: #B98CFF; }
.cap-ticker .chunk.drop { font-size: 84px; }

/* ---------- top chrome ---------- */
#top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: grid; gap: 10px; pointer-events: none; z-index: 5; transition: opacity .3s; }
#bars { display: flex; gap: 3px; }
#bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }

#handle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
#handle img { width: 30px; height: 30px; border-radius: 50%; background: var(--y); object-fit: cover; object-position: 50% 18%; }
#handle small { font-weight: 600; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 56vw; }
.iconbtn { position: absolute; z-index: 6; top: calc(40px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(5,6,12,.45); color: var(--paper); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(8px); }
.iconbtn svg { width: 20px; height: 20px; }
#skip { position: absolute; z-index: 6; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 999px; padding: 10px 14px; background: rgba(5,6,12,.5); color: var(--paper); font: 800 13px var(--body);
  letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px; }
/* the hint: small and quiet (2026-11-08): Manrope, low-opacity cream, no animation */
#hint { position: absolute; z-index: 6; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); max-width: 62%;
  font: 600 12px/1.2 var(--body); letter-spacing: .02em; color: rgba(243,239,228,.5); opacity: 0; pointer-events: none; }
#hint.on { opacity: 1; }
#hint .dot { display: none; }
@keyframes blink { 50% { box-shadow: 0 0 0 9px rgba(238,255,106,0); } }
button:focus-visible, a:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; }

/* ---------- scene layer ---------- */
#layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
#layer > * { pointer-events: auto; }
.pad { position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: calc(84px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.bigbtn { border: 0; cursor: pointer; border-radius: 999px; padding: 18px 26px; font: 800 18px var(--body); color: var(--ink); text-decoration: none;
  background: var(--y); display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 6px 0 #b9c93a; }
.bigbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b9c93a; }
.bigbtn svg { width: 22px; height: 22px; }
.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 6px 0 #b9c93a, 0 0 0 14px rgba(238,255,106,.18); } }
.linkbtn { border: 0; background: none; color: var(--muted); font: 700 14px var(--body); padding: 6px 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px rgba(243,239,228,.4); }
.ghost:active { box-shadow: inset 0 0 0 2px rgba(243,239,228,.4); }

/* ---------- openings: eight layouts ---------- */
.open { background: #000; justify-content: center; gap: 0; overflow: hidden; }
.open .cta { position: relative; z-index: 3; margin-top: auto; display: grid; gap: 12px; justify-items: start; }
.open.go .cta { display: none; }
.ohead { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.ohead .y { color: var(--y); }
.oh1 { margin: 0; font: 400 76px/0.9 var(--display); text-transform: uppercase; letter-spacing: .005em; }
.oh1 span { display: block; opacity: 0; animation: slam .2s cubic-bezier(.2,1.6,.4,1) forwards; }
.open.go { background: radial-gradient(90% 60% at 50% 55%, color-mix(in srgb, var(--y) 70%, transparent), rgba(238,255,106,.18) 45%, rgba(10,10,10,.2) 80%); transition: background .25s; }
/* word: one giant word at a time */
.op-word .ohead { align-items: center; text-align: center; }
.op-word .w1 { font: 400 110px/.9 var(--display); text-transform: uppercase; animation: dropslam .24s cubic-bezier(.2,1.5,.3,1) both; overflow-wrap: anywhere; }
.op-word .wsmall { font: 800 16px var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
/* split: two colour halves */
.op-split { padding: 0; }
.op-split .ohead { justify-content: stretch; }
.op-split .half { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 18px; overflow: hidden; transition: transform .5s cubic-bezier(.7,0,.3,1); }
.op-split .half.t { background: var(--y); color: var(--ink); padding-top: calc(60px + env(safe-area-inset-top, 0px)); }
.op-split .half.b { background: var(--ink); justify-content: flex-start; padding-top: 18px; }
.op-split .half p { margin: 0; font: 400 66px/.92 var(--display); text-transform: uppercase; animation: slidein .4s cubic-bezier(.2,1.3,.3,1) both; }
.op-split .half.b p:nth-child(2) { animation-delay: .35s; }
@keyframes slidein { from { transform: translateX(-110%); } to { transform: none; } }
.op-split .half.t p { animation-name: slidein2; } @keyframes slidein2 { from { transform: translateX(110%); } to { transform: none; } }
.op-split .cta { position: absolute; left: 20px; right: 20px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.op-split.go .half.t { transform: translateY(-100%); } .op-split.go .half.b { transform: translateY(100%); }
.op-split .mid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; z-index: 1; }
/* giant: each line fills the screen */
.op-giant .ohead { justify-content: center; }
.op-giant .g1 { font: 400 120px/.86 var(--display); text-transform: uppercase; white-space: nowrap; animation: dropslam .3s cubic-bezier(.2,1.4,.3,1) both; }
/* type: typewriter */
.op-type .ohead { justify-content: center; }
.op-type .tw { font: 800 31px/1.28 var(--body); white-space: pre-wrap; min-height: 4em; }
.op-type .tw.big { font: 400 74px/.92 var(--display); text-transform: uppercase; }
.op-type .cur { display: inline-block; width: .5em; height: 1em; background: var(--y); vertical-align: -.12em; margin-left: 2px; animation: cur .8s steps(1) infinite; }
@keyframes cur { 50% { opacity: 0; } }
/* marquee: a vertical scroll of outline lines */
.op-marquee { padding-left: 0; padding-right: 0; }
.op-marquee .mq-col { position: absolute; inset: -40% 0 auto 0; display: flex; flex-direction: column; align-items: center; animation: mq 9s linear infinite; }
.op-marquee .mq-col p { margin: 0; font: 400 86px/.98 var(--display); text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px rgba(243,239,228,.55); white-space: nowrap; }
.op-marquee .mq-col p.y { color: var(--y); -webkit-text-stroke: 0; }
@keyframes mq { to { transform: translateY(-50%); } }

/* tape: lines on tilted strips */
.op-tape .ohead { gap: 18px; justify-content: center; }
.op-tape .strip { align-self: flex-start; font: 400 58px/1 var(--display); text-transform: uppercase; padding: 10px 16px 4px; margin-left: -8px;
  animation: tape .3s cubic-bezier(.2,1.5,.4,1) both; transition: transform .45s cubic-bezier(.7,0,.3,1); }

.op-tape .strip:nth-child(2) { background: var(--ink); color: var(--paper); box-shadow: inset 0 0 0 2px var(--paper); --rot: 4deg; margin-left: 30px; }
.op-tape .strip:nth-child(3) { background: var(--y); color: var(--ink); --rot: -3deg; }
.op-tape .strip.off { transform: translateX(140%) rotate(20deg) !important; }

.op-outline .ol { margin: 0; font: 400 80px/.9 var(--display); text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px var(--paper);
  transition: color .5s; animation: up .45s cubic-bezier(.2,1,.3,1) both; }
.op-outline .ol.fill { color: var(--paper); } .op-outline .ol.fill.y { color: var(--y); -webkit-text-stroke-color: var(--y); }

/* lime: the shock opener. a full lime frame, black type, then it flips to black */
.op-lime { background: var(--y); color: var(--ink); }
.op-lime .oh1 span { font-size: 1.12em; }
.op-lime .ohead .y { color: var(--ink); background: var(--paper); padding: 0 .1em; align-self: flex-start; }

.op-lime.go { background: var(--ink); color: var(--paper); } .op-lime.go .ohead .y { color: var(--y); background: none; padding: 0; }

.series { position: absolute; z-index: 3; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); background: var(--y); color: var(--ink);

.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); color: var(--ink); border-radius: 22px 22px 22px 6px; padding: 14px 16px; font: 800 17px/1.3 var(--body); margin-bottom: 54px; }

  background: #1c1c1c; color: var(--paper); box-shadow: 0 6px 0 #000, inset 0 0 0 2px #2a2a2a; transition: transform .08s; }

  var hh = el.querySelector(".card h2"), mx = Math.max.apply(null, h.map(function (w) { return w.length; })), base = lay === "poster" ? 112 : 100;
  if (mx > 5) hh.style.fontSize = Math.round(base * (lay === "sticker" || lay === "ticket" ? 5 : 5.4) / mx) + "px";
  // fit: the card never crops its own last line ("religion, reimagined."). shrink the headline, then the line, until it fits
  (function fit() { var C = el.querySelector(".card"), L = el.querySelector(".card .line"), T = el.querySelector(".card .tag"), fz = parseFloat(getComputedStyle(hh).fontSize) || base, lz = 18, k = 0;
    // measured with offsets (the card animates in with a transform, and its deco shapes overhang on purpose)
    function over() { var y = T.offsetHeight, n = T; while (n && n !== C) { y += n.offsetTop; n = n.offsetParent; } return y > C.clientHeight - 10; }
    while (over() && k++ < 60) { if (fz > 46) { fz -= 4; hh.style.fontSize = fz + "px"; } else if (lz > 14 && L) { lz -= 1; L.style.fontSize = lz + "px"; } else break; }
    if (!fit.again && document.fonts && document.fonts.ready) { fit.again = 1; document.fonts.ready.then(function () { if (el.isConnected) fit(); }); } })();
  later(function () { bigBurst(5); }, 300);
  el.querySelector("#again").addEventListener("click", function (e) { e.stopPropagation(); again(); });
  el.querySelector("#share").addEventListener("click", function (e) { e.stopPropagation(); share(); });
  el.querySelector("#nextUp").addEventListener("click", function (e) { e.stopPropagation(); next(); });
}
function again() { throws = 0; tries = 0; quizRight = 0; quizSeen = {}; go(1); }

/* ---- the cliffhanger ---- */
function sceneCliff(s, i) {
  hideClip(); setMood("pillar"); setCrowd(0); setBars(i, 6); partyAuto = false;
  var C = CFG.cliff || {}, R = rng((ST.seed || 1) * 13), x = 50 + (R() - 0.5) * 20, y = 8, d1 = "M" + x + " " + y, d2 = "", d3 = "";
  for (var k = 0; k < 4; k++) { x += (R() - 0.5) * 26; y += 10 + R() * 6; d1 += " L" + x.toFixed(1) + " " + y.toFixed(1); }
  d2 = "M" + x.toFixed(1) + " " + y.toFixed(1); for (k = 0; k < 4; k++) { x += (R() - 0.5) * 30; y += 8 + R() * 6; d2 += " L" + x.toFixed(1) + " " + y.toFixed(1); }
  d3 = "M" + (x - 2).toFixed(1) + " " + (y - 18).toFixed(1) + " L" + (x - 22 - R() * 14).toFixed(1) + " " + (y - 8).toFixed(1) + " M" + (x + 1).toFixed(1) + " " + (y - 30).toFixed(1) + " L" + (x + 20 + R() * 14).toFixed(1) + " " + (y - 36).toFixed(1);
  var el = document.createElement("div"); el.className = "pad cliff";
  el.innerHTML = '<div class="glow" id="glow"></div><svg class="crack" viewBox="0 0 100 100" preserveAspectRatio="none"><path id="c1" d="' + d1 + '" vector-effect="non-scaling-stroke"/><path id="c2" d="' + d2 + '" vector-effect="non-scaling-stroke"/><path id="c3" d="' + d3 + '" vector-effect="non-scaling-stroke"/></svg>' +
    '<div class="eb">next time on infinite hill</div><p class="say" id="say1" translate="no">' + (C.s1 || "that’s the story.") + '</p><p class="say" id="say2" translate="no">' + (C.s2 || "") + '</p><h2 id="tmr">' + esc(C.tmr || "tomorrow: a new story.") + '</h2>' +
    '<div class="endbtns" id="cb"><a class="bigbtn home" id="home2" href="' + appLink('?done=' + encodeURIComponent(CFG.id)) + '">see what you unlocked</a><button class="bigbtn ghost" id="again2">watch again</button></div>';
  layer.appendChild(el);
  var glow = el.querySelector("#glow");
  function thud(k) { var t = clock() + 0.01; if (DRUMS_ONLY) play("dumBig", t, 0.7 + k * 0.15); else { play("crack", t, 1); play("boom", t, 0.6 + k * 0.2); }
    shake(6 + k * 5); vibrate(50 + k * 30); el.querySelector("#c" + k).classList.add("on"); glow.className = "glow l" + k; flash(COLORS[3], 0.15 + k * 0.12); }
  later(function () { thud(1); el.querySelector("#say1").classList.add("on"); }, 500);
  later(function () { thud(2); el.querySelector("#say2").classList.add("on"); }, 2100);
  later(function () { thud(3); el.querySelector("#tmr").classList.add("on"); }, 3900);
  later(function () { el.querySelector("#cb").classList.add("on"); fillBar(i); }, 2600);
  el.querySelector("#again2").addEventListener("click", function (e) { e.stopPropagation(); again(); });
}

/* ---------- share: a story-size image, then text, then the clipboard ---------- */
function cardImage() {
  return new Promise(function (resolve) {
    try {
      var c = document.createElement("canvas"); c.width = 1080; c.height = 1920; var x = c.getContext("2d"), h = endWords(), E = CFG.end || {};
      x.fillStyle = "#0A0A0A"; x.fillRect(0, 0, 1080, 1920);
      x.fillStyle = "#EEFF6A"; x.beginPath(); x.arc(980, 180, 560, 0, 7); x.fill();
      x.fillStyle = "#1c1c1c"; x.beginPath(); x.arc(40, 1830, 420, 0, 7); x.fill();
      x.fillStyle = "#F3EFE4"; x.font = "800 44px Manrope, sans-serif"; x.fillText("infinite hill", 80, 130);
      var m = Math.max.apply(null, h.map(function (w) { return w.length; })); x.font = "400 " + Math.min(250, Math.round(250 * 5.5 / m)) + "px Anton, Impact, sans-serif";
      h.forEach(function (w, k) { x.fillStyle = k === 2 ? "#EEFF6A" : "#F3EFE4"; x.fillText(w.toUpperCase(), 80, 690 + k * 215); });
      x.fillStyle = "#F3EFE4"; x.font = "800 50px Manrope, sans-serif"; x.fillText(E.l1 || "", 80, 1230); x.fillText(E.l2 || "", 80, 1300);
      x.font = "800 40px Manrope, sans-serif"; x.fillText("religion, reimagined.", 80, 1830);
      c.toBlob(function (b) { resolve(b); }, "image/png");
    } catch (e) { resolve(null); }
  });
}
function share() {
  var url = location.href.split("#")[0], text = CFG.share || (CFG.title + " on infinite hill");
  function clip() { try { navigator.clipboard.writeText(text + " " + url).then(function () { toast("link copied. go post it."); }, function () { toast("copy this page’s link to share it"); }); } catch (e) { toast("copy this page’s link to share it"); } }
  try {
    if (!navigator.share) { clip(); return; }
    cardImage().then(function (blob) {
      var data = { title: CFG.title, text: text, url: url };
      try { if (blob) { var f = new File([blob], "infinite-hill-" + CFG.id + ".png", { type: "image/png" }); if (navigator.canShare && navigator.canShare({ files: [f] })) data = { files: [f], title: CFG.title, text: text }; } } catch (e) {}
      try { navigator.share(data).catch(function (err) { if (!err || err.name !== "AbortError") clip(); }); } catch (e) { clip(); }
    });
  } catch (e) { clip(); }
}
